<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 | STUDIO X</title>
    <meta name="description" content="STUDIO X 결제가 완료되었습니다">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .payment-result {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
        }

        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .result-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 50px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-card h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .result-card .subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .order-info {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .order-info h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .order-row:last-child {
            border-bottom: none;
        }

        .order-row .label {
            color: var(--text-secondary);
        }

        .order-row .value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .order-row.total {
            margin-top: 10px;
            padding-top: 20px;
            border-top: 2px solid var(--accent-primary);
            border-bottom: none;
        }

        .order-row.total .value {
            color: var(--accent-primary);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .result-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .result-actions .btn {
            padding: 15px 30px;
            font-size: 1rem;
        }

        .contact-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .contact-info a {
            color: var(--accent-primary);
        }

        @media (max-width: 480px) {
            .result-card {
                padding: 40px 25px;
            }

            .result-actions {
                flex-direction: column;
            }

            .result-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">◆</span>
                <span class="logo-text">STUDIO<span class="accent">X</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="about.html">회사소개</a></li>
                <li><a href="products.html">상품</a></li>
                <li><a href="index.html#portfolio">포트폴리오</a></li>
                <li><a href="index.html#contact">문의하기</a></li>
            </ul>
            <div class="auth-buttons" id="authButtons">
                <a href="login.html" class="auth-btn login">로그인</a>
                <a href="signup.html" class="auth-btn signup">회원가입</a>
            </div>
            <div class="user-menu" id="userMenu" style="display: none;">
                <span class="user-avatar" id="userAvatar"></span>
                <span class="user-name" id="userName"></span>
                <button class="auth-btn logout" onclick="logoutUser()">로그아웃</button>
            </div>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </nav>

    <!-- Payment Success -->
    <main class="payment-result">
        <div class="result-card">
            <div class="result-icon">✓</div>
            <h1>결제가 완료되었습니다!</h1>
            <p class="subtitle">STUDIO X를 선택해주셔서 감사합니다</p>

            <div class="order-info">
                <h3>주문 정보</h3>
                <div class="order-row">
                    <span class="label">주문번호</span>
                    <span class="value" id="orderId">-</span>
                </div>
                <div class="order-row">
                    <span class="label">상품명</span>
                    <span class="value" id="orderName">-</span>
                </div>
                <div class="order-row">
                    <span class="label">결제수단</span>
                    <span class="value" id="paymentMethod">-</span>
                </div>
                <div class="order-row total">
                    <span class="label">결제금액</span>
                    <span class="value" id="totalAmount">-</span>
                </div>
            </div>

            <div class="result-actions">
                <a href="mypage.html" class="btn primary">주문내역 확인</a>
                <a href="products.html" class="btn outline">다른 상품 보기</a>
            </div>

            <div class="contact-info">
                <p>문의사항이 있으시면 <a href="mailto:hello@studiox.kr">hello@studiox.kr</a>로 연락주세요.</p>
                <p>영업일 기준 24시간 내 담당자가 연락드립니다.</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // URL 파라미터에서 결제 정보 추출 및 저장
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);

            const orderId = urlParams.get('orderId');
            const amount = urlParams.get('amount');
            const paymentKey = urlParams.get('paymentKey');

            // 주문 정보 표시
            if (orderId) {
                document.getElementById('orderId').textContent = orderId;
            }

            if (amount) {
                document.getElementById('totalAmount').textContent =
                    '₩' + parseInt(amount).toLocaleString('ko-KR');
            }

            // sessionStorage에서 주문 정보 가져오기
            const pendingOrder = JSON.parse(sessionStorage.getItem('pendingOrder') || '{}');
            const paymentInfo = JSON.parse(localStorage.getItem('lastPaymentInfo') || '{}');

            if (pendingOrder.productName || paymentInfo.productName) {
                document.getElementById('orderName').textContent =
                    pendingOrder.productName || paymentInfo.productName;
            }

            // 결제 수단 표시
            document.getElementById('paymentMethod').textContent = '카드결제';

            // Firebase에 주문 저장
            if (pendingOrder.userId && orderId) {
                const completeOrder = {
                    ...pendingOrder,
                    paymentKey,
                    orderId,
                    amount: parseInt(amount),
                    status: 'paid',
                    customerName: pendingOrder.userName,
                    customerEmail: pendingOrder.userEmail,
                    completedAt: new Date().toISOString()
                };

                try {
                    // Firestore에 저장
                    await db.collection('orders').add({
                        ...completeOrder,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    console.log('주문이 Firestore에 저장되었습니다:', orderId);

                    // 로컬 스토리지에도 백업
                    let orders = JSON.parse(localStorage.getItem('studioXOrders') || '[]');
                    orders.push(completeOrder);
                    localStorage.setItem('studioXOrders', JSON.stringify(orders));
                } catch (error) {
                    console.error('주문 저장 오류:', error);
                }
            }

            // 세션/로컬 스토리지 정리
            sessionStorage.removeItem('pendingOrder');
            localStorage.removeItem('lastPaymentInfo');
        });
    </script>
</body>
</html>
